name: Deploy

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend → Google Cloud Run
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Authenticate & Configure GCloud ─────────────────────────────────
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Build & Deploy to Cloud Run ──────────────────────────────────────
      - name: Deploy Backend to Google Cloud Run
        id: deploy
        run: |
          gcloud run deploy ecopulse-backend \
            --source ./backend \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},ENV=production"

      # ── Post-deploy health check ─────────────────────────────────────────
      - name: Retrieve Cloud Run Service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ecopulse-backend \
            --region us-central1 \
            --format "value(status.url)")
          echo "service_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health Check (30s retry loop)
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "Probing $SERVICE_URL/health …"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            echo "  Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Health check passed!"; exit 0; }
            sleep 15
          done
          echo "❌ Health check failed after 10 attempts."
          exit 1

  deploy-frontend:
    name: Deploy Frontend → Vercel
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
